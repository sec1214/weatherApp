<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyCast | Modern Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="logo-area">
          <span class="logo-icon">☁️</span>
          <h1>SkyCast</h1>
        </div>
      </header>

      <main class="main-content">
        <form id="weather-form">
          <div class="input-wrapper">
            <input
              type="text"
              id="city-input"
              placeholder="Enter city name..."
              required
              autocomplete="off"
            />
            <button type="submit" id="search-btn">Search</button>
          </div>
        </form>

        <div id="display">
          <div class="welcome-state interactive-sky">
            <svg class="sky-object sun" viewBox="0 0 100 100">
              <circle
                cx="50"
                cy="50"
                r="48"
                fill="#FFD700"
                filter="drop-shadow(0 0 15px rgba(255, 215, 0, 0.8))"
              />
            </svg>

            <svg class="sky-object moon" viewBox="0 0 100 100">
              <path
                fill="#EDEDED"
                d="M50,2C23.5,2,2,23.5,2,50s21.5,48,48,48c26.5,0,48-21.5,48-48c0-1.8-0.1-3.6-0.3-5.3
                C87.4,59.3,75.1,69.1,60.8,69.1c-16.1,0-29.2-13.1-29.2-29.2C31.6,23,41.4,10.7,56.1,6C54.1,3.4,52.1,2.6,50,2z"
              />
            </svg>

            <div class="star star-1"></div>
            <div class="star star-2"></div>
            <div class="star star-3"></div>

            <div class="hero-text">
              <h2>Your world, visualized.</h2>
              <p>
                Search for a city to see live conditions and atmospheric
                visuals.
              </p>
            </div>
          </div>
        </div>
      </main>

      <footer class="app-footer">
        <p>Powered by <span>Visual Crossing</span> & <span>Giphy</span></p>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
